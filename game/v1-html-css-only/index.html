<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Game On!</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbit&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">

    <link href="styles.css" rel="stylesheet">

    <script src="script.js" defer></script>
</head>

<body>

    <main>
        <section id="info">
            <header>
                <h1>RED<br>APPLE</h1>
            </header>

            <section id="rules">
                <h2>Rules:</h2>

                <ul>
                    <li>Pick as many red apples to gain points</li>
                    <li>Apples will spawn on the leaves</li>
                    <li>Apples start as green and will change to red, then brown, then disappear</li>
                    <li>Red = +1 point</li>
                    <li>Green = -1 point</li>
                    <li>Gray = -2 points</li>
                    <li>Missed = -3 points</li>
                </ul>
            </section>
            <div id="button">
                <button id="start">START</button>
            </div>

            <footer>
                <p>Designed by Brent Park</p>
            </footer>

        </section>
    </main>

</body>

</html>
